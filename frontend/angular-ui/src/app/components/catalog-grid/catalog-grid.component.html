<!-- This file defines the HTML structure and semantic layout of the view. -->
<section class="catalog-card">
  <header>
    <h3>Catalog</h3>
    <span>{{ books.length }} results</span>
  </header>

  <div class="grid">
    @for (book of books; track book.id) {
      <app-book-card [book]="book" (addToCart)="addToCart.emit($event)"></app-book-card>
    }
  </div>
</section>
